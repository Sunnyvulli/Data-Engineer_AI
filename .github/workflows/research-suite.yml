name: Research suite integrity
on:
  push:
    paths: ['research-suite/**', '.github/workflows/research-suite.yml']
  pull_request:
    paths: ['research-suite/**', '.github/workflows/research-suite.yml']
permissions:
  contents: read
jobs:
  integrity:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: research-suite
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-lock.txt
      - run: python -m pip install --no-deps -e .
      - run: python -m unittest discover -s tests -v
      - run: research-suite triage examples/claim.json
      - run: python docs/paper/audit_outputs.py
      - run: python docs/paper/audit_three_studies.py
