name: Research suite integrity
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  integrity:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: research-suite
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-lock.txt
      - run: python -m pip install --no-deps -e .
      - run: python -m unittest discover -s tests -v
      - run: research-suite triage examples/claim.json
      - name: Audit retained outputs
        run: |
          mkdir -p .local-ci
          python docs/paper/review_diagnostics.py > .local-ci/review-diagnostics.txt
          git diff --exit-code -- results/validation/review-diagnostics.json
          python docs/paper/audit_outputs.py > .local-ci/output-checks.txt
          python docs/paper/audit_exploratory.py > .local-ci/exploratory-output-checks.txt
          python docs/paper/audit_three_studies.py > .local-ci/study-audit.json
      - uses: actions/upload-artifact@v4
        with:
          name: saved-output-integrity-audits
          path: research-suite/.local-ci/
  history-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan all reachable Git history
        run: >-
          docker run --rm
          -e GIT_CONFIG_COUNT=1
          -e GIT_CONFIG_KEY_0=safe.directory
          -e GIT_CONFIG_VALUE_0=/repo
          -v "$PWD:/repo:ro"
          ghcr.io/gitleaks/gitleaks:v8.24.2
          git /repo --log-opts=--all --gitleaks-ignore-path .gitleaksignore --redact --no-banner
